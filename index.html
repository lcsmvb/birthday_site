<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anniversaire 🎂</title>
<style>
:root{--bg:#fff7ec;--card:#ffffff;--text:#2a1b3d;--muted:#6b5b7e;--accent:#ff4d8d;--accent2:#ffb703;--line:#f0dfc8}
@media (prefers-color-scheme:dark){:root{--bg:#1a1226;--card:#261a38;--text:#fdf3ff;--muted:#b9a8cf;--line:#3b2b55}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS",system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:520px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:28px 22px;text-align:center;box-shadow:0 10px 30px rgba(255,77,141,.15)}
.emoji{font-size:48px}
h1{font-size:2.2rem;margin:8px 0;line-height:1.1}
h1 span{color:var(--accent)}
.age{display:inline-block;background:var(--accent);color:#fff;font-weight:700;border-radius:999px;padding:6px 18px;font-size:1.3rem;margin:6px 0 14px}
.info{display:grid;gap:10px;margin:18px 0;text-align:left}
.info div{background:var(--bg);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.info b{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{color:var(--muted);line-height:1.5}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:14px 24px;cursor:pointer;background:var(--accent);color:#fff;text-decoration:none;display:inline-block;margin-top:6px}
.btn2{background:var(--accent2);color:#2a1b3d}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600}
input,textarea{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);margin:6px 0}
label{display:block;text-align:left;font-size:.85rem;color:var(--muted);margin-top:8px}
.msg{font-size:.9rem;margin-top:10px;min-height:1.2em;color:var(--accent)}
hr{border:0;border-top:1px dashed var(--line);margin:22px 0}

.rsvp{margin-top:20px}
.choix{display:flex;gap:8px;margin:10px 0}
.choix label{flex:1;margin:0;text-align:center;border:2px solid var(--line);border-radius:14px;padding:12px 6px;cursor:pointer;color:var(--text);font-size:.95rem}
.choix input{display:none}
.choix label:has(input:checked){border-color:var(--accent);background:var(--accent);color:#fff;font-weight:700}
.compteur{display:flex;gap:10px;justify-content:center;margin:16px 0 6px;font-weight:700}
.compteur span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
ul.liste{list-style:none;padding:0;margin:10px 0 0;text-align:left;display:grid;gap:8px}
ul.liste li{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.oui{color:#1f9d55;font-weight:700}
.non{color:#d64545;font-weight:700}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <section class="card">
    <div class="emoji">🎉🎂🎈🍾</div>
    <h1>Tu es invité·e à l’anniversaire du <span>goat</span></h1>
    <div class="age">18 ans !</div>
    <div class="info">
      <div><b>Quand</b>Vendredi 27 novembre 2026, à 19h</div>
      <div><b>Où</b>550 Route de Laudun, Résidence La Garrigue, Villa 14</div>
      <div><b>Infos</b> 07 49 08 17 17  </div>
    </div>
    <p>Aide-moi à construire la playlist de la soirée 🎶</p>
    <a class="btn" href="playlist.html">Voir la playlist →</a>
  </section>

  <section class="card rsvp">
    <div class="emoji">🙋</div>
    <h2 style="margin:4px 0">Tu viens ?</h2>
    <label for="rprenom">Ton prénom</label>
    <input id="rprenom" placeholder="Ex : Adrien Taulele" maxlength="30">
    <div class="choix">
      <label><input type="radio" name="rep" value="oui"> ✅ Je viens</label>
      <label><input type="radio" name="rep" value="non"> ❌ Je ne viens pas</label>
    </div>
    <button id="rsend">Envoyer ma réponse</button>
    <div class="msg" id="rmsg"></div>

    <hr>
    <h2 style="margin:0">Les invités</h2>
    <div class="compteur"><span id="cOui">✅ 0</span><span id="cNon">❌ 0</span></div>
    <ul class="liste" id="liste"></ul>
  </section>
</main>

<script>
// ✏️ Colle ici l'adresse de ta base Firebase (voir les explications), par ex :
// "https://mon-anniv-default-rtdb.europe-west1.firebasedatabase.app"
// Si tu laisses vide, le site fonctionne en mode test (les réponses restent sur ton appareil).
var DB_URL = "https://anniv-c1936-default-rtdb.europe-west1.firebasedatabase.app";

var $ = function (id) { return document.getElementById(id); };

function charger() {
  if (DB_URL) {
    return fetch(DB_URL + "/rsvp.json").then(function (r) { return r.json(); }).then(function (d) {
      return d ? Object.keys(d).map(function (k) { return d[k]; }) : [];
    });
  }
  try { return Promise.resolve(JSON.parse(localStorage.getItem("rsvp") || "[]")); }
  catch (e) { return Promise.resolve([]); }
}

function enregistrer(rep) {
  if (DB_URL) {
    return fetch(DB_URL + "/rsvp.json", { method: "POST", body: JSON.stringify(rep) });
  }
  return charger().then(function (l) {
    l.push(rep);
    try { localStorage.setItem("rsvp", JSON.stringify(l)); } catch (e) {}
  });
}

function afficher(liste) {
  var ul = $("liste"); ul.innerHTML = "";
  var oui = 0, non = 0;
  liste.sort(function (a, b) { return (b.t || 0) - (a.t || 0); });
  liste.forEach(function (r) {
    var nb = r.nb > 0 ? r.nb : 1;
    if (r.rep === "oui") oui += nb; else non++;
    var li = document.createElement("li");
    var nom = document.createElement("span"); nom.textContent = r.nom;
    var etat = document.createElement("span");
    etat.className = r.rep === "oui" ? "oui" : "non";
    etat.textContent = r.rep === "oui" ? "✅ Vient" + (nb > 1 ? " (" + nb + " pers.)" : "") : "❌ Ne vient pas";
    li.appendChild(nom); li.appendChild(etat); ul.appendChild(li);
  });
  $("cOui").textContent = "✅ " + oui + (oui > 1 ? " personnes" : " personne");
  $("cNon").textContent = "❌ " + non + (non > 1 ? " absents" : " absent");
  if (!liste.length) ul.innerHTML = "<li>Personne n’a encore répondu, sois le premier !</li>";
}

function rafraichir() {
  charger().then(afficher).catch(function () {
    $("liste").innerHTML = "<li>Impossible de charger la liste.</li>";
  });
}

$("rsend").onclick = function () {
  var nom = $("rprenom").value.trim();
  var choix = document.querySelector('input[name="rep"]:checked');
  if (!nom) { $("rmsg").textContent = "Indique ton prénom 😉"; return; }
  if (!choix) { $("rmsg").textContent = "Dis-nous si tu viens ou non !"; return; }
  var nb = choix.value === "oui" ? Math.min(10, Math.max(1, parseInt($("rnb").value, 10) || 1)) : 0;
  $("rsend").disabled = true;
  enregistrer({ nom: nom, rep: choix.value, nb: nb, t: Date.now() }).then(function () {
    $("rmsg").textContent = choix.value === "oui" ? "Merci, à bientôt ! 🎉" : "Dommage, merci d’avoir répondu !";
    $("rprenom").value = "";
    $("rnb").value = 1;
    $("rsend").disabled = false;
    rafraichir();
  }).catch(function () {
    $("rmsg").textContent = "Oups, l’envoi a échoué. Réessaie.";
    $("rsend").disabled = false;
  });
};

document.querySelectorAll('input[name="rep"]').forEach(function (el) {
  el.onchange = function () {
    $("nbWrap").classList.toggle("hidden", el.value !== "oui" || !el.checked);
  };
});

rafraichir();
</script>
</body>
</html>
